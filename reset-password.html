<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PST — Set New Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/css/auth.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-main-panel auth-main-panel--centered">
        <div class="auth-card-wrap">
          <div class="auth-card">
            <div class="auth-card__brand">
              <div class="brand-mark" id="brand-mark"></div>
              <span class="auth-card__brand-name">PST</span>
            </div>
            <h1>Set new password</h1>
            <p class="auth-card__subtitle">Choose a new password for your account.</p>

            <div id="form-message" class="auth-error"></div>

            <form id="reset-form" class="is-hidden">
              <div class="auth-field">
                <label for="newPassword">New password</label>
                <input type="password" id="newPassword" required autocomplete="new-password" />
              </div>
              <div class="auth-field">
                <label for="confirmPassword">Confirm new password</label>
                <input type="password" id="confirmPassword" required autocomplete="new-password" />
              </div>
              <button type="submit" class="btn btn--primary auth-submit" id="submit-btn">Update password</button>
            </form>

            <p id="invalid-link-note" class="auth-card__note is-hidden">This reset link is missing or invalid.</p>

            <div class="auth-card__back">
              <a href="login.html" class="link-subtle">&larr; Back to sign in</a>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/js/reset-password.js"></script>
  </body>
</html>
