<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PST — Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/css/auth.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-main-panel auth-main-panel--centered">
        <div class="auth-card-wrap">
          <div class="auth-card">
            <div class="auth-card__brand">
              <div class="brand-mark" id="brand-mark"></div>
              <span class="auth-card__brand-name">PST</span>
            </div>
            <h1>Reset your password</h1>
            <p class="auth-card__subtitle">Enter your work email and we'll send you a reset link.</p>

            <div id="form-message" class="auth-error"></div>

            <form id="forgot-form">
              <div class="auth-field">
                <label for="email">Work email</label>
                <input type="email" id="email" required autocomplete="username" placeholder="name@company.com" />
              </div>
              <button type="submit" class="btn btn--primary auth-submit" id="submit-btn">Send reset link</button>
            </form>

            <div class="auth-card__back">
              <a href="login.html" class="link-subtle">&larr; Back to sign in</a>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/js/forgot-password.js"></script>
  </body>
</html>
